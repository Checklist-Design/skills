name: Release on skill change

# Every merge that changes the skills, the hook, or the manifests gets a
# version bump and a release, without anyone remembering to do it. Matches
# what comparable plugin repos do (mattpocock/skills via changesets,
# supabase/agent-skills via release-please) — a version that silently stops
# tracking the code is how people end up debugging a version that doesn't
# exist.
#
# Content-only updates (new checklists published on the site) are handled
# separately by refresh-checklists.yml. This one is for changes to the skill
# itself.

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - '.agents/**'
      - 'hooks/**'
      - '.claude-plugin/**'

permissions:
  contents: write

# Shares a group with refresh-checklists.yml so the two can never bump the
# version concurrently and race each other's push.
concurrency:
  group: version-and-release
  cancel-in-progress: false

jobs:
  release:
    # Without this guard the two workflows feed each other forever: the daily
    # refresh commits -> this workflow fires -> it commits -> the refresh
    # fires. Skipping bot-authored pushes breaks the loop.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bump patch version
        id: bump
        run: echo "version=$(node scripts/bump-version.mjs)" >> "$GITHUB_OUTPUT"

      - name: Commit and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v${VERSION}"
          git push
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes "Automated release for skill changes merged to main. See the commit history for details."
